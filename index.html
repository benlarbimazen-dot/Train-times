<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Warwick Ave">
<title>Warwick Avenue trains</title>
<style>
  :root {
    --bg: #f6f3ee; --ink: #1d1a17; --muted: #6f675f; --line: #ddd5ca;
    --bakerloo: #b36305;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17140f; --ink: #f3ece2; --muted: #a39a8e; --line: #353028; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    max-width: 520px; margin-inline: auto;
  }
  header { border-left: 8px solid var(--bakerloo); padding-left: 14px; margin-bottom: 28px; }
  h1 { margin: 0; font-size: 1.7rem; font-weight: 700; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
  h2 { font-size: 1rem; font-weight: 400; color: var(--muted); margin: 26px 0 8px; }
  .next { font-size: 4.5rem; line-height: 1; font-weight: 700; margin: 0; }
  .next small { font-size: 1.2rem; font-weight: 400; color: var(--muted); }
  .dest { margin: 4px 0 0; font-size: 1.1rem; }
  ul { list-style: none; padding: 0; margin: 14px 0 0; }
  li { display: flex; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--line); }
  li span:last-child { font-variant-numeric: tabular-nums; }
  #status { margin-top: 30px; color: var(--muted); font-size: .85rem; }
  button {
    margin-top: 12px; font: inherit; padding: 10px 18px; border-radius: 8px;
    border: 1px solid var(--ink); background: transparent; color: var(--ink);
  }
</style>
</head>
<body>
<header>
  <h1>Warwick Avenue</h1>
  <p>Bakerloo line, live departures</p>
</header>
<main id="board"><p>Loading trains…</p></main>
<p id="status"></p>
<button id="refresh">Refresh now</button>

<script>
const STOP_ID = "940GZZLUWKA"; // Warwick Avenue Underground station
const URL = "https://api.tfl.gov.uk/StopPoint/" + STOP_ID + "/Arrivals";
const board = document.getElementById("board");
const status = document.getElementById("status");

function mins(sec) {
  const m = Math.floor(sec / 60);
  return m < 1 ? "Due" : m + " min";
}

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function render(arrivals) {
  board.replaceChildren();
  if (!arrivals.length) {
    board.append(el("p", "No trains reported right now."));
    return;
  }
  const groups = {};
  arrivals.forEach(a => {
    const key = a.platformName || a.direction || "Platform";
    (groups[key] = groups[key] || []).push(a);
  });
  Object.keys(groups).sort().forEach(key => {
    const trains = groups[key].sort((a, b) => a.timeToStation - b.timeToStation);
    const first = trains[0];
    board.append(el("h2", key));
    const big = el("p", "", "next");
    const m = Math.floor(first.timeToStation / 60);
    big.append(document.createTextNode(m < 1 ? "Due" : m), el("small", m < 1 ? "" : " min"));
    board.append(big);
    board.append(el("p", "to " + (first.destinationName || first.towards || "unknown").replace(" Underground Station", ""), "dest"));
    const list = el("ul");
    trains.slice(1, 5).forEach(t => {
      const li = el("li");
      li.append(
        el("span", (t.destinationName || t.towards || "").replace(" Underground Station", "")),
        el("span", mins(t.timeToStation))
      );
      list.append(li);
    });
    board.append(list);
  });
}

async function load() {
  status.textContent = "Updating…";
  try {
    const res = await fetch(URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    render(await res.json());
    status.textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  } catch (err) {
    status.textContent = "Couldn't load times (" + err.message + "). Check your connection.";
  }
}

document.getElementById("refresh").addEventListener("click", load);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(load, 30000);
load();
</script>
</body>
</html>
